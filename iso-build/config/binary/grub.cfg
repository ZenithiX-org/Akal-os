# live-build binary GRUB config — Akal OS boot menu
# This is placed at /boot/grub/grub.cfg in the ISO.

set default="0"
set timeout=3
set gfxmode=1920x1080,1280x720,auto
set gfxpayload=keep

insmod all_video
insmod gfxterm
insmod png
insmod part_gpt
insmod part_msdos

# Akal OS branding
set menu_title="Akal OS 1.0"

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    terminal_input console
    terminal_output gfxterm
fi

if background_image /boot/grub/akal-grub.png; then
  set color_normal=white/black
  set color_highlight=black/white
else
  set color_normal=light-gray/black
  set color_highlight=black/light-gray
fi

menuentry "Akal OS 1.0 (Live)" --id akal-live {
    echo "Loading Akal OS kernel..."
    linux /live/vmlinuz boot=live components quiet splash hostname=akal-os username=akal user-fullname=Akal
    echo "Loading Akal OS initramfs..."
    initrd /live/initrd.img
}

menuentry "Akal OS 1.0 (Live, Safe Graphics)" --id akal-safe {
    echo "Loading Akal OS kernel (safe graphics)..."
    linux /live/vmlinuz boot=live components quiet nomodeset hostname=akal-os username=akal user-fullname=Akal
    initrd /live/initrd.img
}

menuentry "Akal OS 1.0 (Install to disk)" --id akal-install {
    echo "Starting Akal OS installer..."
    linux /live/vmlinuz boot=live components install hostname=akal-os username=akal user-fullname=Akal
    initrd /live/initrd.img
}
